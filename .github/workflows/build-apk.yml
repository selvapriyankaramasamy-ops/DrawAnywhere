name: Build debug APK

# Runs on every push to any branch, on pull requests, and can also be
# triggered manually from the Actions tab ("Run workflow" button).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest GitHub runners come with the Android SDK, platforms,
      # and build-tools preinstalled (ANDROID_HOME already set) — no
      # separate SDK setup action needed. If this project's compileSdk
      # (37) isn't already on the image, AGP will auto-download it during
      # the build; pre-accepting licenses here avoids that hanging on an
      # unattended license prompt.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrawAnywhere-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
